name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: codeberg-medium
    container:
      image: golang:1.26
    steps:
      - run: apt-get update && apt-get install -y nodejs
      - uses: actions/checkout@v6
      - run: go vet ./...

  test:
    runs-on: codeberg-medium
    container:
      image: golang:1.26
    steps:
      - run: apt-get update && apt-get install -y nodejs
      - uses: actions/checkout@v6
      - run: go test -race -cover ./internal/...

  build:
    runs-on: codeberg-medium
    container:
      image: golang:1.26
    steps:
      - run: apt-get update && apt-get install -y nodejs libgl1-mesa-dev xorg-dev
      - uses: actions/checkout@v6
      - run: go build ./cmd/mkhtpasswd

  release:
    needs: [lint, test, build]
    runs-on: codeberg-medium
    container:
      image: golang:1.26
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - run: apt-get update && apt-get install -y nodejs libgl1-mesa-dev xorg-dev zip curl jq
      - uses: actions/checkout@v6
      - run: go build -o mkhtpasswd-linux-amd64 ./cmd/mkhtpasswd
      - run: tar czf mkhtpasswd-linux-amd64.tar.gz mkhtpasswd-linux-amd64
      - run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o mkhtpasswd-darwin-amd64 ./cmd/mkhtpasswd
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o mkhtpasswd-darwin-arm64 ./cmd/mkhtpasswd
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o mkhtpasswd-windows-amd64.exe ./cmd/mkhtpasswd
      - run: |
          tar czf mkhtpasswd-darwin-amd64.tar.gz mkhtpasswd-darwin-amd64
          tar czf mkhtpasswd-darwin-arm64.tar.gz mkhtpasswd-darwin-arm64
          zip mkhtpasswd-windows-amd64.zip mkhtpasswd-windows-amd64.exe
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$GITHUB_REF_NAME\", \"name\": \"$GITHUB_REF_NAME\"}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          for FILE in mkhtpasswd-linux-amd64.tar.gz mkhtpasswd-darwin-amd64.tar.gz mkhtpasswd-darwin-arm64.tar.gz mkhtpasswd-windows-amd64.zip; do
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$FILE" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$FILE"
          done