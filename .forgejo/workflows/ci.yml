on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: docker
    container:
      image: golang:1.26
    steps:
      - uses: actions/checkout@v6
      - run: go vet ./...

  test:
    runs-on: docker
    container:
      image: golang:1.26
    steps:
      - uses: actions/checkout@v6
      - run: go test -race -cover ./internal/...

  build:
    runs-on: docker
    container:
      image: golang:1.26
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
      - run: go build ./cmd/mkhtpasswd

  release:
    needs: [lint, test, build]
    runs-on: docker
    container:
      image: golang:1.26
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - run: |
          apt-get update && apt-get install -y zip libgl1-mesa-dev xorg-dev
      - run: go build -o mkhtpasswd-linux-amd64 ./cmd/mkhtpasswd
      - run: tar czf mkhtpasswd-linux-amd64.tar.gz mkhtpasswd-linux-amd64
      - run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o mkhtpasswd-darwin-amd64 ./cmd/mkhtpasswd
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o mkhtpasswd-darwin-arm64 ./cmd/mkhtpasswd
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o mkhtpasswd-windows-amd64.exe ./cmd/mkhtpasswd
      - run: |
          tar czf mkhtpasswd-darwin-amd64.tar.gz mkhtpasswd-darwin-amd64
          tar czf mkhtpasswd-darwin-arm64.tar.gz mkhtpasswd-darwin-arm64
          zip mkhtpasswd-windows-amd64.zip mkhtpasswd-windows-amd64.exe
      - uses: https://github.com/softprops/action-gh-release@v2
        with:
          files: |
            mkhtpasswd-linux-amd64.tar.gz
            mkhtpasswd-darwin-amd64.tar.gz
            mkhtpasswd-darwin-arm64.tar.gz
            mkhtpasswd-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}